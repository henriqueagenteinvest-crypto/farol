{"name":"Compilar APK do Farol","on":{"push":{},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"name":"Gerar APK","runs-on":"ubuntu-latest","steps":[{"name":"Baixar o repositorio","uses":"actions/checkout@v4"},{"name":"Descompactar o projeto","run":"if [ -f Farol.zip ]; then unzip -o -q Farol.zip -d . && rm -f Farol.zip; fi; ls -la"},{"name":"Conferir se o projeto chegou","run":"if [ ! -f pubspec.yaml ]; then echo 'ERRO: faltou enviar o Farol.zip'; exit 1; fi"},{"name":"Instalar o Java","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Instalar o Flutter","uses":"subosito/flutter-action@v2","with":{"channel":"stable","cache":true}},{"name":"Versao do Flutter","run":"flutter --version"},{"name":"Gerar as pastas do Android","run":"cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak && flutter create . --project-name farol --org br.com.motorista --platforms=android && rm -rf lib && cp -r /tmp/lib_bak lib && cp /tmp/pubspec_bak pubspec.yaml"},{"name":"Aplicar o manifesto com as permissoes","run":"cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml"},{"name":"Baixar as dependencias","run":"flutter pub get"},{"name":"Gerar o icone do app","run":"dart run flutter_launcher_icons || echo 'icone pulado'"},{"name":"Analise do codigo","run":"flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analise.txt || true"},{"name":"Rodar os testes","run":"flutter test 2>&1 | tee testes.txt || true"},{"name":"Compilar o APK","run":"flutter build apk --release"},{"name":"Guardar os relatorios","if":"always()","uses":"actions/upload-artifact@v4","with":{"name":"relatorios","path":"*.txt","if-no-files-found":"ignore"}},{"name":"Guardar o APK","uses":"actions/upload-artifact@v4","with":{"name":"Farol-APK","path":"build/app/outputs/flutter-apk/app-release.apk"}},{"name":"Publicar o APK para download","uses":"softprops/action-gh-release@v2","with":{"tag_name":"v1.0.${{ github.run_number }}","name":"Farol v1.0.${{ github.run_number }}","body":"APK do Farol gerado automaticamente. Baixe o app-release.apk e instale no celular.","files":"build/app/outputs/flutter-apk/app-release.apk"},"env":{"GITHUB_TOKEN":"${{ secrets.GITHUB_TOKEN }}"}}]}}}
